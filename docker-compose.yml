# Local WordPress demo for woo-donate (port 8081 to avoid clashing with woo-pay).
#
#   docker compose up -d
#   # open http://localhost:8081, finish the WP installer
#   # Plugins - activate Woo Donate; Settings - Stellar Donations to configure
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: stellar-demo-root
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: stellar-demo
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    depends_on:
      - db
    image: wordpress:6.7-php8.2
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: stellar-demo
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./:/var/www/html/wp-content/plugins/woo-donate

volumes:
  db_data:
